[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acdc"
version = "0.1.0"
description = "Fellowship prover wrapper and argument/debate calculus"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
  "lark>=1.1,<2",
  "pexpect>=4.8,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-xdist>=3.5,<4",
  "jsonschema>=4,<5",
]

[project.scripts]
acdc = "wrap.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "pres*", "wrap*"]

[tool.setuptools.package-data]
wrap = ["schemas/*.json"]

[tool.pytest.ini_options]
# The slow tests (tests/slow_tests.txt) are left out of the default run:
# `make test-all` runs them.  `make test-perf` runs the performance tests alone.
markers = [
    "perf: performance test - size and growth on generated documents (make test-perf runs them alone)",
    "slow: costly and adding little to the default run; listed in tests/slow_tests.txt (make test-all)",
]
addopts = "-m 'not slow'"
